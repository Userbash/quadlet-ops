name: node2-ops-kit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh scripts/lib/*.sh
      - run: sudo apt-get update && sudo apt-get install -y fish
      - run: fish -n scripts/*.fish
      - run: git diff --check
      - name: Scan public files for obvious secrets
        run: |
          if grep -RInE '(/etc/shadow|BEGIN (RSA|OPENSSH|EC|PRIVATE)|(^|[[:space:]])(password|token|secret)[[:space:]]*=' . --exclude-dir=.git --exclude-dir=backups --exclude='*.md' --exclude='.env.example' --exclude='.env' --exclude='backup.yml'; then
            echo 'Review possible secret material before publishing.' >&2
            exit 1
          fi
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package project bundle
        run: tar --exclude=.git --exclude=backups --exclude=.env --exclude='.env.*' --exclude='*.key' --exclude='*.pem' --exclude='*.crt' --exclude='*.db' --exclude='*.sqlite*' -czf node2-ops-kit.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: node2-ops-kit
          path: node2-ops-kit.tgz
