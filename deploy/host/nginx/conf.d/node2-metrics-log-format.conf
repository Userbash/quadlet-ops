log_format node2_metrics escape=json '{"status":$status,'
                                    '"request_time":$request_time,"request_length":$request_length,'
                                    '"bytes_sent":$body_bytes_sent,"limit_req":"$limit_req_status",'
                                    '"limit_conn":"$limit_conn_status"}';

# Short-retention incident correlation log: source and response only, no URI,
# query string, cookies, headers, or user-agent.
log_format node2_incident escape=json '{"peer":"$remote_addr","status":$status,'
                                      '"request_time":$request_time,"request_length":$request_length,'
                                      '"bytes_sent":$body_bytes_sent,"upstream_time":"$upstream_response_time",'
                                      '"upstream_status":"$upstream_status"}';
