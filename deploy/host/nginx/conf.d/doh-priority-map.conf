# DoH per-client timeout group. Managed by doh-499-monitor.
map $binary_remote_addr $doh_read_timeout {
    default 30s;
}

log_format doh_detailed '$remote_addr [$time_iso8601] method=$request_method status=$status $body_bytes_sent '
                        'request_time=$request_time upstream_response_time=$upstream_response_time '
                        'upstream_status=$upstream_status request_completion=$request_completion '
                        'connection_requests=$connection_requests';
