# Защита только панели; XHTTP location /api/v1/messages/ использует отдельный лимит и не затрагивается.
limit_req_zone $binary_remote_addr zone=panel_auth:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=panel_conn:10m;
limit_req_zone $binary_remote_addr zone=doh_per_ip:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=doh_conn:10m;
log_format panel_security '$remote_addr [$time_iso8601] status=$status bytes=$body_bytes_sent '
                          'request_time=$request_time limit_req=$limit_req_status limit_conn=$limit_conn_status';
