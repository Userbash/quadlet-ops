user www-data;
worker_processes auto;
worker_rlimit_nofile 131072;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 8192;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;
	ssl_session_tickets off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;

	##
	# Logging Settings
	##

	log_format download_json escape=json
		'{"remote_addr":"$remote_addr","time":"$time_iso8601","request":"$request_method $uri",'
		'"request_method":"$request_method","uri":"$uri","status":$status,'
		'"body_bytes_sent":$body_bytes_sent,"http_range":"$http_range",'
		'"sent_http_content_range":"$sent_http_content_range",'
		'"request_time":$request_time,"request_completion":"$request_completion"}';

	log_format node2_access escape=json '{"remote_addr":"$remote_addr","time":"$time_iso8601",'
		'"method":"$request_method","uri":"$uri","status":$status,'
		'"bytes_sent":$body_bytes_sent,"request_time":$request_time}';
	access_log /var/log/nginx/access.log node2_access;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


