log_format node2_download escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"http_range":"$http_range","content_range":"$sent_http_content_range","http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';

server {
    listen 80;
    listen [::]:80;
    server_name __NODE2_DOMAIN__;
    root __NODE2_WEB_ROOT__;
    access_log /var/log/nginx/node2_download.log node2_download;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __NODE2_DOMAIN__;
    root __NODE2_WEB_ROOT__;
    access_log /var/log/nginx/node2_download.log node2_download;

    ssl_certificate /etc/letsencrypt/live/__NODE2_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__NODE2_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}
